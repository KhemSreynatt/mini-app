<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluetooth Scanner</title>
</head>
<style>
    .button{
        height: 40px;
        width: 200px;   
    }
</style>
<body>
   <div style="background-color: white;">
    <h1>Bluetooth Scanner</h1>
    <!-- <button onclick="openLinkForAndroid()">Opent Chrome</button> -->
    <button onclick="detectionBlue()">Bluetooth</button>
    <button onclick="getDeviceInfo()">getDeviceInfo</button>
    
    <h1>Bluetooth Scanner</h1>
    <!-- <button id="startScanButton">Start Scanning</button> -->
    <div id="devices"></div>

    <script src="scanner.js"></script>
   </div>

    <script>
          function openLinkForAndroid() {
                const url = 'https://khemsreynatt.github.io/mini-app/';
                
                if (window.Telegram && Telegram.WebApp) {
                    Telegram.WebApp.openLink(url);
                } else {
                    console.log("Telegram WebApp not detected. Opening in a new tab...");
                    window.open(url, "_blank");
                }
            }

            document.getElementById('startScanButton').addEventListener('click', scanAndSendBluetoothDevices);
            function detectionBlue() {
            if (!navigator.bluetooth) {
                console.error('Web Bluetooth API is not supported in this browser.');
            } else {
                navigator.bluetooth.requestDevice({
                    acceptAllDevices: true, // Accept all nearby devices
                    optionalServices: [] // No need to specify services
                })
                    .then(device => {
                        console.log('Detected Bluetooth Device:');
                        console.log('Name:', device.name); // Device name (if available)
                        console.log('ID:', device.id); // Device ID
                        console.log('UUID:', device.uuid); // Device UUID
                        console.log('Is nearby:', true); // Device is nearby
                        document.getElementById('dectionInfo').textContent = `Name:${device.name} ID:${device.id}`
                    })
                    .catch(error => {
                        console.error('Error detecting Bluetooth devices:', error);
                    });
            }

        }

            function getDeviceInfo(device) {
                if (!navigator.bluetooth) {
                    console.error('Web Bluetooth API is not supported in this browser.');
                } else {
                    navigator.bluetooth.getDevices().then((devices) => {
                    devices.forEach(
                        device => {
                            console.log('Device:', device.name);
                        });
                    });
                }
               
            }


    </script>
</body>
</html>
