<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluetooth Device Scanner</title>
</head>

<body>
    <h1>Scan for Nearby Bluetooth Devices</h1>
    <button onclick="detectAndVerifyDeviceName()">Scan for Bluetooth Devices</button>
    <button id="scanButton">Scan Bluetooth</button>
    <div id="result"></div>
    <div id="devices"></div>
    <script>
        // Function to detect and verify a Bluetooth device by name
        async function detectAndVerifyDeviceName() {
            try {
                // Trigger the browser's device picker
                if(!navigator.bluetooth) {
                    document.getElementById('result').textContent = 'Web Bluetooth not supported this browser!!';
                }else{
                    document.getElementById('result').textContent = 'Web Bluetooth supported this browser!';
                    const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Holy-IOT' }], // Filter by name
                    optionalServices: [] // No services needed for name verification
                });

                // Verify the name directly (no pairing/connection required)
                if (device.name === 'Holy-IOT') {
                    console.log('✅ Name verified:', device.name);
                    console.log('Device ID:', device.id);
                } else {
                    console.log('❌ Name mismatch:', device.name);
                }
                }
               
            } catch (error) {
                console.error('Error:', error);
            }
        }
 





    </script>


  <script>
    // Check if Web Bluetooth and requestLEScan are supported
    if (!navigator.bluetooth ) {
      alert('Web Bluetooth LE Scan is not supported in this browser.');
    }

    // Start scanning for BLE devices
    const startScan = async () => {
      try {
        console.log('Starting BLE scan...');

        // Request LE scan
        const scan = await navigator.bluetooth.requestLEScan({
          acceptAllAdvertisements: true, // Set to false to filter devices
        });

        console.log('Scan started successfully.');

        // Listen for advertisement events
        navigator.bluetooth.addEventListener('advertisementreceived', (event) => {
          console.log('Advertisement received:', event);

          // Display device information
          const deviceInfo = `
            <div class="device">
              <strong>Device Name:</strong> ${event.device.name || 'Unknown'}<br>
              <strong>Device ID:</strong> ${event.device.id}<br>
              <strong>RSSI:</strong> ${event.rssi}<br>
              <strong>UUIDs:</strong> ${event.uuids ? event.uuids.join(', ') : 'None'}
            </div>
          `;

          document.getElementById('devices').insertAdjacentHTML('beforeend', deviceInfo);
        });

        // Stop scanning after 10 seconds (optional)
        setTimeout(() => {
          scan.stop();
          console.log('Scan stopped.');
        }, 10000); // 10 seconds

      } catch (error) {
        console.error('Error starting BLE scan:', error);
      }
    };

    // Add click event listener to the button
    document.getElementById('scanButton').addEventListener('click', startScan);
  </script>
</body>

</html>
