<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluetooth Device Scanner</title>
</head>

<body>
    <h1>Scan for Nearby Bluetooth Devices</h1>
    <button onclick="startScanning()">Scan for Bluetooth Devices</button>
    <button id="scanButton">Scan Bluetooth</button>
    <div id="result"></div>

    <script>
        // Function to detect and verify a Bluetooth device by name
        async function detectAndVerifyDeviceName() {
            try {
                // Trigger the browser's device picker
                if(!navigator.bluetooth) {
                    document.getElementById('result').textContent = 'Web Bluetooth not supported this browser!!';
                }else{
                    document.getElementById('result').textContent = 'Web Bluetooth supported this browser!';
                    const device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'Holy-IOT' }], // Filter by name
                    optionalServices: [] // No services needed for name verification
                });

                // Verify the name directly (no pairing/connection required)
                if (device.name === 'Holy-IOT') {
                    console.log('✅ Name verified:', device.name);
                    console.log('Device ID:', device.id);
                } else {
                    console.log('❌ Name mismatch:', device.name);
                }
                }
               
            } catch (error) {
                console.error('Error:', error);
            }
        }
        document.getElementById('scanButton').addEventListener('click', async () => {
            if (!navigator.bluetooth) {
                console.error('Web Bluetooth API not supported in this browser.');
                return;
            }

            try {
                const scan = await navigator.bluetooth.requestLEScan({
                    filters: [{ name: 'MyDevice' }] // Replace 'MyDevice' with the actual device name
                });

                console.log('Scanning started for MyDevice...');

                navigator.bluetooth.addEventListener('advertisementreceived', event => {
                    console.log('✅ Device found:', event.device.name || 'Unnamed Device');
                    console.log('UUIDs:', event.uuids);
                    console.log('RSSI:', event.rssi);
                });

                // Stop scanning after 10 seconds
                setTimeout(() => {
                    try {
                        scan.stop();
                        console.log('Scanning stopped.');
                    } catch (error) {
                        console.warn('Stopping scan is not supported:', error);
                    }
                }, 10000);

            } catch (error) {
                console.error('Error:', error);
            }
        });






    </script>



    </script>
</body>

</html>
